
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Website Temporarily Unavailable</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8f6f1;
        color: #292820;
        font-family: Arial, sans-serif;
        text-align: center;
      }
      main { max-width: 520px; }
      .symbol { font-size: 42px; margin-bottom: 24px; }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(30px, 6vw, 44px);
        font-weight: 500;
        margin: 0 0 18px;
      }
      p {
        color: #68665e;
        font-size: 16px;
        line-height: 1.7;
      }
      .line {
        width: 56px;
        height: 2px;
        background: #a27b43;
        margin: 24px auto;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="symbol" aria-hidden="true">📚</div>
      <h1>Website Temporarily Unavailable</h1>
      <div class="line"></div>
      <p>We're making some updates. Please check back later.</p>
    </main>
  </body>
</html>
